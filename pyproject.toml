[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m365-service-comms-mcp"
version = "0.1.1"
description = "Read-only Model Context Protocol (MCP) server for the Microsoft Graph Service Communications API — exposes M365 service health and Message Center posts to AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tim Robichaux", email = "timrob@users.noreply.github.com" },
]
keywords = ["mcp", "model-context-protocol", "microsoft-graph", "m365", "service-health", "message-center"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.2.0",
    "azure-identity>=1.19.0",
    "msal>=1.31.0",
    "msal-extensions>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
]

[project.scripts]
m365-service-comms-mcp = "m365_service_comms_mcp.__main__:main"
m365-svc-comms-mcp = "m365_service_comms_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/trobichaux/m365-service-comms-mcp"
Repository = "https://github.com/trobichaux/m365-service-comms-mcp"
Issues = "https://github.com/trobichaux/m365-service-comms-mcp/issues"
Changelog = "https://github.com/trobichaux/m365-service-comms-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/m365_service_comms_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:msal.*",
]

[tool.coverage.run]
source = ["src/m365_service_comms_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
